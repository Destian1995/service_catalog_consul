server {
    listen 80;
    server_name moncatalog moncatalog.aton.ru tstmon201 _;

    client_max_body_size 10M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Static files — served directly by Nginx, cached in browser
    location /static/ {
        alias /app/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA entry points
    location = / {
        alias /app/static/;
        try_files /index.html =404;
        expires 5m;
    }

    location = /admin {
        alias /app/static/;
        try_files /admin.html =404;
        expires 5m;
    }

    # API — proxy to Gunicorn
    location /api/ {
        proxy_pass http://catalog-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Fallback — other paths (e.g. JS/CSS/images without /static/ prefix)
    location / {
        proxy_pass http://catalog-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
