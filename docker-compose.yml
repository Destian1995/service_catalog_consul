services:
  catalog-app:
    build: .
    container_name: catalog-app
    restart: unless-stopped
    # Настройки входа через Keycloak: скопируйте .env.example в .env и заполните.
    env_file: .env
    volumes:
      - ./consul_manager_config.json:/app/consul_manager_config.json
      - catalog-journal:/app/data
    environment:
      CONSUL_JOURNAL_DB: /app/data/deregistrations.sqlite3
      CATALOG_USERS_DB: /app/data/catalog-users.sqlite3
      # To import external HTTP requests, mount Consul Enterprise audit logs read-only
      # and set CONSUL_AUDIT_FILES, for example '["/audit/*.jsonl*"]'.
    networks:
      - catalog-net

  catalog-nginx:
    image: nginx:alpine
    container_name: catalog-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - catalog-app
    networks:
      - catalog-net

networks:
  catalog-net:
    driver: bridge

volumes:
  catalog-journal:
