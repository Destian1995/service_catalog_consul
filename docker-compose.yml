services:
  catalog-app:
    build: .
    container_name: catalog-app
    restart: unless-stopped
    volumes:
      - ./consul_manager_config.json:/app/consul_manager_config.json
    networks:
      - catalog-net

  catalog-nginx:
    image: nginx:alpine
    container_name: catalog-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalog-app
    networks:
      - catalog-net

networks:
  catalog-net:
    driver: bridge
